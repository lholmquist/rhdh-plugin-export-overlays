                - dn: ${LDAP_USERS_DN}
                  options:
                    filter: (uid=*)
              groups:
                - dn: ${LDAP_GROUPS_DN}
                  options:
                    filter: (cn=*)
              schedule:
                frequency:
                  minutes: 60
                initialDelay:
                  seconds: 15
                timeout:
                  minutes: 15
